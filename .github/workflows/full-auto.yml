name: Full Auto Deploy XanKong Cocaking OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Syntax check bot.js
        run: node --check bot.js

      - name: Build Docker image
        run: docker build -t xankong-cocaking-os:latest .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker tag xankong-cocaking-os:latest ${{ secrets.DOCKERHUB_USERNAME }}/xankong-cocaking-os:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/xankong-cocaking-os:latest
